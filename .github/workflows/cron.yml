name: Notificaciones Cron

on:
  schedule:
    # Ejecuta cada 30 minutos (ej: 00:00, 00:30, 01:00...)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint unificado de notificaciones
        run: |
          curl -X GET "https://wellnessv1.vercel.app/api/notifications?secret=${{ secrets.CRON_SECRET }}" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
