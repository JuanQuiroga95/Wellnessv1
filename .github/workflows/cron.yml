name: Recordatorios Cron

on:
  schedule:
    # Ejecuta cada 30 minutos (ej: 00:00, 00:30, 01:00...)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de recordatorios
        run: |
          curl -X GET "https://wellness-app-production.up.railway.app/api/cron/reminders?token=${{ secrets.CRON_SECRET }}" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          # Nota: Cambiar la URL de arriba por el dominio real en producción
